<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра - Snake Online</title>
    <link rel="stylesheet" href="../static/game.css">
</head>
<body>
    <div class="game-container">
        <!-- Хедер с информацией -->
        <header class="game-header">
            <div class="game-info">
                <div class="player-stats">
                    <span class="stat">Очки: <strong id="score">0</strong></span>
                    <span class="stat">Длина: <strong id="length">1</strong></span>
                    <span class="stat">Убийства: <strong id="kills">0</strong></span>
                </div>
                <div class="room-info">
                    <span id="roomName">Комната: #1</span>
                </div>
            </div>
            <div class="game-controls">
                <button class="btn-control" onclick="leaveGame()">Выйти</button>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="game-main">
            <!-- Игровое поле -->
            <div class="game-area">
                <canvas id="gameCanvas" width="800" height="800"></canvas>
                <div class="game-overlay" id="gameOverlay">
                    <div class="overlay-content">
                        <h2>Игра началась!</h2>
                        <p>Управляйте змейкой с помощью мыши</p>
                        <button class="btn-start" onclick="hideOverlay()">Начать</button>
                    </div>
                </div>
            </div>

            <!-- Боковая панель -->
            <div class="sidebar">
                <!-- Лидерборд -->
                <div class="leaderboard">
                    <h3>Лидерборд</h3>
                    <div class="players-list" id="playersList">
                        <div class="player-item">
                            <span class="player-rank">1</span>
                            <span class="player-name">Player1</span>
                            <span class="player-kills">15 kills</span>
                        </div>
                        <div class="player-item">
                            <span class="player-rank">2</span>
                            <span class="player-name">Player2</span>
                            <span class="player-kills">12 kills</span>
                        </div>
                        <div class="player-item current-player">
                            <span class="player-rank">3</span>
                            <span class="player-name">You</span>
                            <span class="player-kills">8 kills</span>
                        </div>
                    </div>
                </div>

                <!-- Чат -->
                <div class="chat">
                    <h3>Чат</h3>
                    <div class="messages" id="messages">
                        <div class="message system">
                            <span class="message-text">Добро пожаловать в игру!</span>
                        </div>
                        <div class="message">
                            <span class="player-name">Player1:</span>
                            <span class="message-text">Привет всем!</span>
                        </div>
                        <div class="message">
                            <span class="player-name">Player2:</span>
                            <span class="message-text">Удачи в игре!</span>
                        </div>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Введите сообщение...">
                        <button onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/game.js?v=1.0"></script>
</body>
</html>
